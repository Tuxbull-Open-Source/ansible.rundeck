---
# protocol that is used by browser to access
rundeck_protocol: "https"

# fqdn that get accessed by web browser
rundeck_domain: "{{ansible_fqdn}}"

# Required Rundeck web administrator password. Supply via Ansible Vault or an
# approved secret manager; this role intentionally has no usable default.
rundeck_admin_pass: ''

# plugins to download and install, Ansible get installed by default, this is just an example
rundeck_plugins: []
# - 'https://github.com/rundeck-plugins/ansible-plugin/releases/download/v4.0.7/ansible-plugin-4.0.7.jar'

jdbc_version: '3.5.6'

# generate ssh keys
rundeck_generate_ssh: True

# Install and configure Ansible for rundeck user
rundeck_install_ansible: True
rundeck_ansible_installer_url: 'https://raw.githubusercontent.com/joe-speedboat/ansible.installer/refs/heads/main/ansible/ansible_setup.sh'
rundeck_ansible_installer_path: /usr/local/sbin/ansible_setup.sh
rundeck_ansible_uv_marker: /opt/ansible/.ansible-uv-installer
rundeck_ansible_install_user: "{{ rundeck_user }}"
rundeck_ansible_install_group: ansible

# Manage local firewall exposure for the nginx HTTPS reverse proxy.
rundeck_manage_firewalld: True

# mariadb settings
mariadb_db_host: '127.0.0.1'
mariadb_db_name: 'rundeck'
mariadb_db_user: 'rundeck'
# Required Rundeck MariaDB-user password. Supply via Ansible Vault or an
# approved secret manager; this role intentionally has no usable default.
mariadb_user_password: ''

# we use nginx reverse proxy
nginx_ssl_cert_dir: /etc/nginx
nginx_ssl_cert_days: 3650
nginx_ssl_cert_host: "{{ rundeck_domain }}"
nginx_ssl_cert_key: "{{ nginx_ssl_cert_host }}_key.pem"
nginx_ssl_cert_crt: "{{ nginx_ssl_cert_host }}_crt.pem"
nginx_ssl_cert_ca_chain: "{{ nginx_ssl_cert_host }}_ca_chain.pem"
nginx_ssl_cert_dhparam: "dhparam.pem"

...
